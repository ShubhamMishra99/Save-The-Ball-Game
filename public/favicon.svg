<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FF922B" />
      <stop offset="100%" stop-color="#E8590C" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF922B" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Glow Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#ballGrad)" filter="url(#glow)"/>
  <!-- Highlight -->
  <ellipse cx="38" cy="30" rx="14" ry="8" fill="#FFF" opacity="0.65" transform="rotate(-25 38 30)"/>
  <!-- Expressive Eyes -->
  <circle cx="40" cy="48" r="6" fill="#1A1523"/>
  <circle cx="60" cy="48" r="6" fill="#1A1523"/>
  <!-- Eye Sparkles -->
  <circle cx="38" cy="46" r="2.2" fill="#FFF"/>
  <circle cx="58" cy="46" r="2.2" fill="#FFF"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="32" cy="56" rx="4" ry="2.5" fill="#FF6B6B" opacity="0.6"/>
  <ellipse cx="68" cy="56" rx="4" ry="2.5" fill="#FF6B6B" opacity="0.6"/>
  <!-- Cute Happy Smile -->
  <path d="M 44 58 Q 50 66 56 58" stroke="#1A1523" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Drawn saving arc line underneath -->
  <path d="M 18 84 Q 50 94 82 82" stroke="#4DABF7" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
